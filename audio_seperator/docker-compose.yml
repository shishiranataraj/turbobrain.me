version: '3.8'

services:
  audio-separator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-separator
    ports:
      - "8080:5000"
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    volumes:
      # Persist uploads and outputs
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      # Optional: Mount .env file for local development
      - ./.env:/app/.env:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Cloudflare Tunnel (optional - uncomment to use)
